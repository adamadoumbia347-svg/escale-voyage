# Examen ponctuel du moteur White Label (options de tri disponibles) – lancé à la main
name: Examiner le moteur de vols
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wl:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger et chercher les options de tri
        run: |
          curl -sL "https://tpemb.com/wl_web/main.js?wl_id=24006" -o main.js
          for f in $(grep -oE '[A-Za-z0-9_./-]+\.js' main.js | sort -u | head -40); do n=$(basename "$f"); curl -sL "https://tpemb.com/wl_web/$n" -o "c_$n"; done
          echo "=== enum tri"; grep -oE '.{0,40}e\.Best = "best".{0,400}' c_*.js | head -3
          echo "=== SortBy"; grep -oE 'SortBy[^"]{0,60}' c_*.js | sort -u | head -30
          echo "=== usages sort_by / sortBy"; grep -oE '.{80}(sortBy|sort_by|setSort)[^;]{0,120}' c_*.js | sort -u | head -30
          echo "=== traductions tri"; grep -oE '"(sort|sorting)[A-Za-z_.]*"\s*:\s*"[^"]{0,60}"' c_*.js main.js | sort -u | head -40
          echo "=== textes fr"; grep -oE '"[^"]{0,30}(rapide|moins cher|Trier|Meilleur|meilleur)[^"]{0,30}"' c_*.js main.js | sort -u | head -40
