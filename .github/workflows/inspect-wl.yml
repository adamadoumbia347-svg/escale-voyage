# Examen ponctuel du moteur White Label (options de tri disponibles) – lancé à la main
name: Examiner le moteur de vols
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wl:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger et chercher les options de tri
        run: |
          curl -sL "https://tpemb.com/wl_web/main.js?wl_id=24006" -o main.js
          for f in $(grep -oE '[A-Za-z0-9_./-]+\.js' main.js | sort -u | head -40); do n=$(basename "$f"); curl -sL "https://tpemb.com/wl_web/$n" -o "c_$n"; done
          ls -la
          echo "=== tri / sort"; cat main.js c_*.js | grep -oiE '.{60}(sort(ing)?|fastest|cheapest|optimal|best_?price|bestOffer)[^;]{0,80}' | sort -u | head -80
          echo "=== paramètres d'adresse"; cat main.js c_*.js | grep -oE '(searchParams\.get|URLSearchParams)[^;]{0,120}' | sort -u | head -40
          echo "=== textes français"; cat main.js c_*.js | grep -oE '"(Le plus rapide|Le moins cher|Optimal|Le meilleur|Rapide|Moins cher)[^"]{0,40}"' | sort -u | head
