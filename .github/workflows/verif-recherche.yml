# Vérification du moteur de recherche en direct (/recherche/, White Label Travelpayouts) dans un vrai navigateur.
# Lancé à la main : affiche ce que le moteur affiche (formulaire, champs, résultats) et l'adresse après une recherche.
name: Vérifier la recherche en direct
on:
  workflow_dispatch:
    inputs:
      chemin:
        description: "Page à ouvrir (ex. /recherche/ ou /recherche/?…)"
        required: false
        default: "/recherche/"

permissions:
  contents: read

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Chromium (Playwright)
        run: |
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Ouvrir la page et décrire le moteur
        env:
          URL: https://escale.live${{ inputs.chemin || '/recherche/' }}
        run: |
          cat > v.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1280, height: 900 }, locale: 'fr-FR' });
            const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text()); });
            const reqs = new Set(); p.on('request', r => { const h = new URL(r.url()).host; if (!h.includes('escale.live')) reqs.add(h); });
            await p.goto(process.env.URL, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto', e.message));
            await p.waitForTimeout(8000);
            const d = await p.evaluate(() => {
              const s = document.querySelector('#tpwl-search'), t = document.querySelector('#tpwl-tickets');
              const host = (el) => el && (el.shadowRoot || el);
              const desc = (el) => { if (!el) return null; const r = host(el); return {
                html: (r.innerHTML || '').length, texte: (r.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 400),
                inputs: [...r.querySelectorAll('input')].map(i => [i.name, i.placeholder, i.value, i.type].join('|')).slice(0, 12),
                boutons: [...r.querySelectorAll('button')].map(x => x.textContent.trim()).filter(Boolean).slice(0, 12),
                iframes: [...r.querySelectorAll('iframe')].map(f => f.src).slice(0, 3), shadow: !!el.shadowRoot }; };
              return { url: location.href, search: desc(s), tickets: desc(t) };
            });
            console.log(JSON.stringify(d, null, 1));
            console.log('Domaines appelés :', [...reqs].join(', '));
            await p.screenshot({ path: 'recherche.png', fullPage: true });
            // Essai de recherche : bouton principal du formulaire
            const btn = p.locator('#tpwl-search button[type=submit], #tpwl-search button:has-text("Rechercher"), #tpwl-search button:has-text("Search")').first();
            if (await btn.count()) {
              await btn.click().catch(e => console.log('clic', e.message));
              await p.waitForTimeout(15000);
              const after = await p.evaluate(() => ({ url: location.href, tickets: (document.querySelector('#tpwl-tickets') || {}).textContent?.replace(/\s+/g, ' ').trim().slice(0, 600) }));
              console.log('Après recherche :', JSON.stringify(after));
              const links = await p.$$eval('#tpwl-tickets a', as => as.map(a => a.href).slice(0, 5));
              console.log('Liens des résultats :', links.join(' | '));
            } else console.log('Pas de bouton de recherche trouvé');
            console.log('Erreurs :', errs.slice(0, 8));
            await b.close();
          })();
          JS
          node v.js
